<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Manager</title>

  <!-- Font Awesome 6 (latest) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <i class="fa-solid fa-boxes-stacked brand-icon"></i>
        <h1>Inventory Manager</h1>
      </div>
      <nav class="header-nav">
        <button id="open-add-modal" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i>
          Add Product
        </button>
      </nav>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="container app-main">
    <div class="page-heading">
      <h2><i class="fa-solid fa-warehouse"></i> Products</h2>
      <p class="subtitle">Manage your inventory in real time</p>
    </div>

    <div id="status" class="status"></div>

    <section id="products" class="product-grid" aria-live="polite">
      <!-- Product cards rendered by app.js -->
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="app-footer">
    <div class="container footer-inner">
      <p>
        <i class="fa-solid fa-code"></i>
        Built with TypeScript, Express &amp; Redis
      </p>
      <p class="muted">&copy; 2026 Inventory Manager</p>
    </div>
  </footer>

  <!-- ============ ADD PRODUCT DIALOG ============ -->
  <dialog id="add-modal" class="modal">
    <form id="add-form" method="dialog">
      <div class="modal-header">
        <h3><i class="fa-solid fa-circle-plus"></i> Add Product</h3>
        <button type="button" id="close-add-modal" class="icon-btn" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">
        <label>
          <span><i class="fa-solid fa-tag"></i> Name</span>
          <input type="text" name="name" required placeholder="e.g. Monitor" />
        </label>

        <label>
          <span><i class="fa-solid fa-dollar-sign"></i> Price</span>
          <input type="number" name="price" step="0.01" min="0" required placeholder="199.99" />
        </label>

        <label>
          <span><i class="fa-solid fa-cubes"></i> Stock</span>
          <input type="number" name="stock" min="0" required placeholder="10" />
        </label>
      </div>

      <div class="modal-footer">
        <button type="button" id="cancel-add" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
